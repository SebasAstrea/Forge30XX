[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-python"
version = "0.1.0"
description = "Forge30XX ML + RAG: QLoRA (Unsloth), embeddings, guard model, port-rag-potty"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Núcleo ligero (sin GPU). Las dependencias pesadas de ML van en el extra [ml].
  "pydantic>=2.8",
]

# Dependencias de ML con GPU. Stack fijado en docs/SDD.md sección 8.
# Se instalan en runners con GPU (ci-hardware.yml), no en CI estándar.
# `train` es lo mínimo para `make train-lora` (docs/training.md). Instalar
# torch primero: si no, pip se pierde probando versiones de unsloth.
[project.optional-dependencies]
train = [
  "torch>=2.4",
  "unsloth>=2024.10",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "safetensors>=0.4",
]
ml = [
  "forge-python[train]",
  "FlagEmbedding>=1.2",
  "chromadb>=0.5",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.112",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_ml*", "forge_rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# C90: complejidad ciclomática ≤10 (AGENTS.md 11.1). T20: sin print() (11.3).
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C90", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# Paquetes del extra [ml] (solo en el entorno con GPU); sin stubs en CI estándar.
[[tool.mypy.overrides]]
module = ["unsloth", "unsloth.*", "trl", "datasets", "torch", "numpy", "huggingface_hub"]
ignore_missing_imports = true

[tool.coverage.run]
# qlora.py necesita GPU y el extra [ml]: se valida con `make train-lora` en
# hardware real (AGENTS.md 11.11), no en la CI estándar.
omit = ["forge_ml/qlora.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["forge_ml", "forge_rag", "tests"]
