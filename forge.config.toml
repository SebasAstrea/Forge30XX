# Configuración de Forge30XX. Ver docs/SDD.md sección 2 (perfiles) y README.
# Los valores pueden sobreescribirse con variables de entorno prefijo FORGE_.

[hardware]
profile = "auto"           # "A", "B" o "auto"
gpu_index = 0              # GPU principal
kv_split_ratio = 0.6       # Perfil B: fracción de KV en GPU0

[model]
path = "models/Qwen3.5-4B-Q4_K_M.gguf"   # A; B: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf (ADR-0013)
context_size = 32768
kv_type_k = "turbo2"       # -ctk del llama-server. A: turbo2; B: f16 (ADR-0006)
kv_type_v = "turbo2"       # -ctv del llama-server. A: turbo2; B: turbo3

[inference]
base_url = "http://127.0.0.1:8080"
temperature = 0.2
top_p = 0.95
max_tokens = 4096
grammar = "tool_calls.gbnf"

[context_router]
rag_threshold_tokens = 1500   # A: 1500, B: 3000
summarize_at_percent = 70

[rag]
# Servicio RAG externo (port-rag-potty). Ver docs/rag-integration.md, ADR-0001.
base_url = "http://localhost:8765"
timeout_ms = 5000

[security]
guard_input = true
guard_output = true
guard_on_cpu_threshold = 0.90
allowed_domains = ["docs.python.org", "doc.rust-lang.org", "developer.mozilla.org"]

[tools]
workspace = "."
max_file_size_mb = 10
shell_timeout_s = 30
shell_allowlist = ["ls", "cat", "grep", "find", "git", "cargo", "npm", "python"]

[ui]
port = 7860
theme = "dark"

[training]
# QLoRA de tool-calling (RF-03, RF-03b, ADR-0012). `make train-lora PROFILE=A|B`.
# Modelo base en Hugging Face y revisión fijada (RNF-09: hash del modelo base).
dataset = "artifacts/dataset-v1"
seed = 42

[training.A]
# RF-03b: Unsloth + QLoRA 4-bit + gradient checkpointing + paged_adamw_8bit, batch efectivo 8.
base_model = "unsloth/Qwen2.5-Coder-3B-Instruct-bnb-4bit"
revision = "84f4805873850233fe5b2b156d3e3435425b4098"
max_seq_len = 2048
batch_size = 2
grad_accum = 4
lora_r = 16
lora_alpha = 32
learning_rate = 0.0002
epochs = 1

[training.B]
base_model = "unsloth/Qwen2.5-Coder-7B-Instruct-bnb-4bit"
revision = "4858886f896bd05db823557fc5cbc4ac28342af7"
max_seq_len = 2048
batch_size = 2
grad_accum = 4
lora_r = 16
lora_alpha = 32
learning_rate = 0.0002
epochs = 1
